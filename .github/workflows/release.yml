name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify release version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          assert.match(version, /^\d+\.\d+\.\d+$/);
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(pkg.version, version, 'Tag must match package.json version');
          assert.equal(lock.version, version, 'Tag must match package-lock.json version');
          assert.equal(lock.packages[''].version, version, 'Tag must match lockfile root version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - run: node --version

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      - run: npm test -- --run
        env:
          CI: true

      - run: cp -R ./dist ./docker/dist

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ./web/docker/
          file: ./web/docker/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: |
            lifescience/mri-viewer:latest
            lifescience/mri-viewer:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

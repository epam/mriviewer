name: "AI Code Review: MRI Viewer Platforms"

on:
  workflow_dispatch:

permissions:
  contents: write # Allows CodeMie to post comments/reviews directly to the PR
  pull-requests: write

jobs:
  review-visionos:
    name: Review VisionOS
    runs-on: [self-hosted, epam, linux]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so CodeMie can generate git diffs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: CodeMie AI Review VisionOS
        continue-on-error: true
        env:
          # Authenticate CodeMie via your DIAL API Key
          CODEMIE_API_KEY: ${{ secrets.DIAL_API_KEY }}
          CODEMIE_BASE_URL: "https://ai.epam.com/openai"
          CODEMIE_PROVIDER: "litellm"
          CODEMIE_MODEL: "gpt-4o"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Install the official public CodeMie CLI package globally
          npm install -g @codemieai/code --registry=https://registry.npmjs.org/

          # 2. Quietly install and compile the Claude agent dependencies
          codemie install claude --supported

          # 3. Run review by dynamically reading rules from visionos/REVIEW_RULES.md into the task prompt
          codemie-claude \
            --task "Perform a code review on this pull request. You MUST strictly follow the custom project review guidelines defined here: $(cat visionos/REVIEW_RULES.md)" \
            --silent \
            --dangerously-skip-permissions

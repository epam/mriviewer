name: "AI Code Review: MRI Viewer Platforms"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, 'release/**', master]
    paths:
      - 'visionos/**'
      - '!visionos/**/*.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  review-visionos:
    name: Review VisionOS
    # Use EPAM's private self-hosted runners
    runs-on: [self-hosted, epam-private-vpc, linux-x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # NEW STEP: Set up Node.js and configure EPAM's private NPM registry
      - name: Setup Node and Configure EPAM Registry
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # This configures .npmrc to route @epam scoped packages to the EPAM Artifactory registry
          registry-url: 'https://artifactory.epam.com/artifactory/api/npm/npm-repos/'
          scope: '@epam'

      - name: CodeMie AI Review VisionOS
        continue-on-error: true
        env:
          CODEMIE_API_KEY: ${{ secrets.DIAL_API_KEY }}
          CODEMIE_BASE_URL: "https://ai.epam.com/openai"
          CODEMIE_PROVIDER: "litellm"
          CODEMIE_MODEL: "gpt-4o"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the registry token if authentication is required by EPAM Artifactory (usually automated on self-hosted runners)
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          npx @epam/codemie-cli review-pr \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.number }}" \
            --path "visionos" \
            --rules "visionos/REVIEW_RULES.md"
